---
layout: default
---

<div class="page">
    <div class="left">
        {{ content }}
    </div>

    <button class="anchor" type="button" aria-controls="content-panel" aria-expanded="false" aria-label="打开页面目录">
        <i class="fa fa-list" aria-hidden="true"></i><span class="visually-hidden">目录</span>
    </button>
    <aside id="content-panel" class="right" aria-label="页面目录">
        <div class="wrap">
            <div class="side content">
                <div><i class="fa fa-th-list" aria-hidden="true"></i> 目录</div>
                <ul id="content-side" class="content-ul"></ul>
            </div>
        </div>
    </aside>
</div>
<script src="{{ "/js/pageContent.js" | prepend: site.baseurl }}" charset="utf-8"></script>
