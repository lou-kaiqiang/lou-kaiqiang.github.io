{% capture tags %}
  {% if post %}
    {% for tag in post.tags %}
        <a href="{{ site.baseurl }}/{{ site.tag_dir }}#{{ tag }}" title="标签：{{ tag }}" rel="tag"><span>{{ tag | join: "/" }}</span></a>{% unless forloop.last %}&nbsp;{% endunless %}
    {% endfor %}
  {% else %}
    {% for tag in page.tags %}
        <a href="{{ site.baseurl }}/{{ site.tag_dir }}#{{ tag }}" title="标签：{{ tag }}" rel="tag"><span>{{ tag | join: "/" }}</span></a>{% unless forloop.last %}&nbsp;{% endunless %}
    {% endfor %}
  {% endif %}
{% endcapture %}
<span class="pageTag">
  <i class="fa fa-tags" aria-hidden="true"></i>{{ tags }}
</span>
