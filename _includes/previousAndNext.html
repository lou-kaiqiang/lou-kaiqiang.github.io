<nav class="post-recent" aria-label="相邻文章">
    {% if page.previous %}
    <div class="pre">
        <a rel="prev" href="{{ page.previous.url | prepend: site.baseurl }}" aria-label="上一篇：{{ page.previous.title }}">
            <strong>上一篇</strong>
            <span>{{ page.previous.title }}</span>
        </a>
    </div>
    {% endif %}

    {% if page.next %}
    <div class="nex">
        <a rel="next" href="{{ page.next.url | prepend: site.baseurl }}" aria-label="下一篇：{{ page.next.title }}">
            <strong>下一篇</strong>
            <span>{{ page.next.title }}</span>
        </a>
    </div>
    {% endif %}
</nav>
